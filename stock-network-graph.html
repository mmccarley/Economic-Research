<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Network Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0e17;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #c8d6e5;
    overflow: hidden;
    height: 100vh;
  }

  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, rgba(10,14,23,0.95) 60%, rgba(10,14,23,0));
    pointer-events: none;
  }
  #header > * { pointer-events: auto; }
  #header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #e4e8f0;
  }
  #header h1 span { color: #6c8cff; }

  #controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .control-group label {
    font-size: 12px;
    color: #8899aa;
    white-space: nowrap;
  }
  #controls input[type=range] {
    width: 110px;
    accent-color: #6c8cff;
    cursor: pointer;
  }
  .control-value {
    font-size: 12px;
    color: #6c8cff;
    min-width: 28px;
    text-align: center;
    font-weight: 600;
  }

  #graph-container {
    width: 100vw;
    height: 100vh;
  }

  .link { stroke-linecap: round; }

  .node-circle {
    cursor: pointer;
    transition: filter 0.2s;
  }
  .node-circle:hover {
    filter: brightness(1.35) drop-shadow(0 0 8px rgba(108,140,255,0.5));
  }

  .node-label {
    fill: #fff;
    text-anchor: middle;
    dominant-baseline: central;
    font-weight: 600;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }

  #tooltip {
    position: fixed;
    display: none;
    background: rgba(18, 24, 42, 0.96);
    border: 1px solid #2a3550;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    pointer-events: none;
    z-index: 100;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    min-width: 195px;
  }
  #tooltip .tt-ticker {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  #tooltip .tt-name {
    font-size: 11px;
    color: #8899aa;
    margin-bottom: 8px;
  }
  #tooltip .tt-row {
    display: flex;
    justify-content: space-between;
    margin: 3px 0;
    font-size: 12px;
  }
  #tooltip .tt-label { color: #8899aa; }
  #tooltip .tt-value { font-weight: 600; }

  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(18, 24, 42, 0.9);
    border: 1px solid #2a3550;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    z-index: 10;
    backdrop-filter: blur(6px);
    max-height: 60vh;
    overflow-y: auto;
  }
  #legend h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8899aa;
    margin-bottom: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 5px 0;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-members {
    font-size: 10px;
    color: #667788;
    margin-left: 18px;
    margin-bottom: 4px;
  }

  #info-hint {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 11px;
    color: #556677;
    z-index: 10;
    text-align: right;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="header">
  <h1><span>&#9670;</span> Stock Correlation Network</h1>
  <div id="controls">
    <div class="control-group">
      <label>Correlation threshold</label>
      <input type="range" id="threshold-slider" min="0.15" max="0.95" step="0.05" value="0.55">
      <span class="control-value" id="threshold-value">0.55</span>
    </div>
    <div class="control-group">
      <label>Clusters</label>
      <input type="range" id="cluster-slider" min="2" max="12" step="1" value="6">
      <span class="control-value" id="cluster-value">6</span>
    </div>
  </div>
</div>

<div id="graph-container"></div>

<div id="tooltip">
  <div class="tt-ticker"></div>
  <div class="tt-name"></div>
  <div class="tt-row"><span class="tt-label">Sector</span><span class="tt-value tt-sector"></span></div>
  <div class="tt-row"><span class="tt-label">Market Cap</span><span class="tt-value tt-mcap"></span></div>
  <div class="tt-row"><span class="tt-label">Cluster</span><span class="tt-value tt-cluster"></span></div>
  <div class="tt-row"><span class="tt-label">Connections</span><span class="tt-value tt-conn"></span></div>
  <div class="tt-row"><span class="tt-label">Avg Correlation</span><span class="tt-value tt-corr"></span></div>
</div>

<div id="legend"></div>
<div id="info-hint">
  Scroll to zoom &middot; Drag nodes &middot; Hover for details<br>
  Clusters detected from return correlation, not sector labels
</div>

<script>
// ── Stock universe ───────────────────────────────────────────────────
const stocks = [
  // Technology
  { ticker: "AAPL",  name: "Apple Inc.",          sector: "Technology",  marketCap: 3100 },
  { ticker: "MSFT",  name: "Microsoft Corp.",     sector: "Technology",  marketCap: 2900 },
  { ticker: "GOOGL", name: "Alphabet Inc.",       sector: "Technology",  marketCap: 1950 },
  { ticker: "AMZN",  name: "Amazon.com Inc.",     sector: "Technology",  marketCap: 1850 },
  { ticker: "NVDA",  name: "NVIDIA Corp.",        sector: "Technology",  marketCap: 2700 },
  { ticker: "META",  name: "Meta Platforms",      sector: "Technology",  marketCap: 1400 },
  { ticker: "TSLA",  name: "Tesla Inc.",          sector: "Technology",  marketCap: 800  },
  { ticker: "AVGO",  name: "Broadcom Inc.",       sector: "Technology",  marketCap: 700  },
  { ticker: "ORCL",  name: "Oracle Corp.",        sector: "Technology",  marketCap: 380  },
  { ticker: "CRM",   name: "Salesforce Inc.",     sector: "Technology",  marketCap: 270  },
  { ticker: "AMD",   name: "AMD Inc.",            sector: "Technology",  marketCap: 250  },
  { ticker: "INTC",  name: "Intel Corp.",         sector: "Technology",  marketCap: 120  },
  // Finance
  { ticker: "JPM",   name: "JPMorgan Chase",      sector: "Finance",    marketCap: 580  },
  { ticker: "BAC",   name: "Bank of America",     sector: "Finance",    marketCap: 330  },
  { ticker: "GS",    name: "Goldman Sachs",       sector: "Finance",    marketCap: 170  },
  { ticker: "MS",    name: "Morgan Stanley",      sector: "Finance",    marketCap: 160  },
  { ticker: "WFC",   name: "Wells Fargo",         sector: "Finance",    marketCap: 210  },
  { ticker: "BLK",   name: "BlackRock Inc.",      sector: "Finance",    marketCap: 140  },
  { ticker: "C",     name: "Citigroup Inc.",      sector: "Finance",    marketCap: 120  },
  { ticker: "AXP",   name: "American Express",    sector: "Finance",    marketCap: 175  },
  // Healthcare
  { ticker: "UNH",   name: "UnitedHealth Grp",    sector: "Healthcare", marketCap: 520  },
  { ticker: "JNJ",   name: "Johnson & Johnson",   sector: "Healthcare", marketCap: 390  },
  { ticker: "LLY",   name: "Eli Lilly",           sector: "Healthcare", marketCap: 720  },
  { ticker: "PFE",   name: "Pfizer Inc.",         sector: "Healthcare", marketCap: 160  },
  { ticker: "ABBV",  name: "AbbVie Inc.",         sector: "Healthcare", marketCap: 310  },
  { ticker: "MRK",   name: "Merck & Co.",         sector: "Healthcare", marketCap: 280  },
  { ticker: "TMO",   name: "Thermo Fisher",       sector: "Healthcare", marketCap: 210  },
  // Energy
  { ticker: "XOM",   name: "Exxon Mobil",         sector: "Energy",     marketCap: 460  },
  { ticker: "CVX",   name: "Chevron Corp.",       sector: "Energy",     marketCap: 290  },
  { ticker: "COP",   name: "ConocoPhillips",      sector: "Energy",     marketCap: 130  },
  { ticker: "SLB",   name: "Schlumberger",        sector: "Energy",     marketCap: 75   },
  { ticker: "EOG",   name: "EOG Resources",       sector: "Energy",     marketCap: 70   },
  // Consumer
  { ticker: "WMT",   name: "Walmart Inc.",        sector: "Consumer",   marketCap: 530  },
  { ticker: "PG",    name: "Procter & Gamble",    sector: "Consumer",   marketCap: 370  },
  { ticker: "KO",    name: "Coca-Cola Co.",       sector: "Consumer",   marketCap: 260  },
  { ticker: "PEP",   name: "PepsiCo Inc.",        sector: "Consumer",   marketCap: 230  },
  { ticker: "COST",  name: "Costco Wholesale",    sector: "Consumer",   marketCap: 350  },
  { ticker: "MCD",   name: "McDonald's Corp.",    sector: "Consumer",   marketCap: 210  },
  { ticker: "NKE",   name: "Nike Inc.",           sector: "Consumer",   marketCap: 120  },
  // Industrial
  { ticker: "CAT",   name: "Caterpillar Inc.",    sector: "Industrial", marketCap: 180  },
  { ticker: "BA",    name: "Boeing Co.",          sector: "Industrial", marketCap: 130  },
  { ticker: "HON",   name: "Honeywell Intl",      sector: "Industrial", marketCap: 145  },
  { ticker: "UPS",   name: "United Parcel",       sector: "Industrial", marketCap: 110  },
  { ticker: "GE",    name: "GE Aerospace",        sector: "Industrial", marketCap: 190  },
  { ticker: "DE",    name: "Deere & Company",     sector: "Industrial", marketCap: 115  },
];

const N = stocks.length;

// ── Seeded PRNG ──────────────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(77);

// Box-Muller for normal distribution
function randNormal() {
  let u, v;
  do { u = rng(); } while (u === 0);
  v = rng();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

// ── Simulate daily returns via latent factor model ───────────────────
// Each stock's return = sum of (factor_loading * factor_return) + idiosyncratic noise
// Factors are abstract — they are NOT sectors. Stocks load on them organically;
// the resulting correlations may or may not align with sector labels.
const NUM_DAYS = 252;    // ~1 year of trading days
const NUM_FACTORS = 8;   // hidden latent factors

// Generate random factor loadings per stock (each stock loads on each factor)
const factorLoadings = [];  // [stock][factor]
for (let i = 0; i < N; i++) {
  const loadings = [];
  for (let f = 0; f < NUM_FACTORS; f++) {
    // Each stock gets a sparse-ish loading: ~40% chance of meaningful exposure
    loadings.push(rng() < 0.4 ? randNormal() * 0.6 : randNormal() * 0.05);
  }
  // Every stock has some market beta (factor 0)
  loadings[0] = 0.3 + Math.abs(randNormal()) * 0.4;
  factorLoadings.push(loadings);
}

// Generate daily factor returns
const factorReturns = [];  // [day][factor]
for (let d = 0; d < NUM_DAYS; d++) {
  const dayFactors = [];
  for (let f = 0; f < NUM_FACTORS; f++) {
    dayFactors.push(randNormal() * 0.015);  // ~1.5% daily factor vol
  }
  factorReturns.push(dayFactors);
}

// Generate daily stock returns
const dailyReturns = [];  // [stock][day]
for (let i = 0; i < N; i++) {
  const returns = [];
  for (let d = 0; d < NUM_DAYS; d++) {
    let r = 0;
    for (let f = 0; f < NUM_FACTORS; f++) {
      r += factorLoadings[i][f] * factorReturns[d][f];
    }
    r += randNormal() * 0.012;  // idiosyncratic noise
    returns.push(r);
  }
  dailyReturns.push(returns);
}

// ── Compute Pearson correlation matrix ───────────────────────────────
function mean(arr) { return arr.reduce((s, v) => s + v, 0) / arr.length; }

function pearson(a, b) {
  const ma = mean(a), mb = mean(b);
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) {
    const x = a[i] - ma, y = b[i] - mb;
    num += x * y;
    da += x * x;
    db += y * y;
  }
  const denom = Math.sqrt(da) * Math.sqrt(db);
  return denom === 0 ? 0 : num / denom;
}

// Full correlation matrix
const corrMatrix = [];
for (let i = 0; i < N; i++) {
  corrMatrix[i] = new Float64Array(N);
  corrMatrix[i][i] = 1.0;
}
const allEdges = [];
for (let i = 0; i < N; i++) {
  for (let j = i + 1; j < N; j++) {
    const c = pearson(dailyReturns[i], dailyReturns[j]);
    corrMatrix[i][j] = c;
    corrMatrix[j][i] = c;
    allEdges.push({ source: i, target: j, correlation: +c.toFixed(4) });
  }
}

// ── Spectral clustering on the correlation matrix ────────────────────
// 1. Build affinity matrix from correlations (shift to non-negative)
// 2. Compute graph Laplacian
// 3. Use power iteration to approximate top-k eigenvectors
// 4. K-means on the embedding

function spectralCluster(corrMat, n, k) {
  // Affinity: shift correlations so all >= 0, zero out diagonal
  const W = [];
  for (let i = 0; i < n; i++) {
    W[i] = new Float64Array(n);
    for (let j = 0; j < n; j++) {
      if (i !== j) {
        // Use (1 + corr) / 2 to map [-1,1] -> [0,1]
        W[i][j] = Math.max(0, (1 + corrMat[i][j]) / 2);
      }
    }
  }

  // Degree matrix D and normalized Laplacian: L_sym = I - D^{-1/2} W D^{-1/2}
  const deg = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) deg[i] += W[i][j];
  }
  const dinvSqrt = new Float64Array(n);
  for (let i = 0; i < n; i++) dinvSqrt[i] = deg[i] > 0 ? 1.0 / Math.sqrt(deg[i]) : 0;

  // We want the smallest eigenvectors of L, which equals the largest of (I - L) = D^{-1/2} W D^{-1/2}
  // Compute M = D^{-1/2} W D^{-1/2} and find top-k eigenvectors via power iteration with deflation
  function matVecM(v) {
    const result = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let sum = 0;
      for (let j = 0; j < n; j++) {
        sum += dinvSqrt[i] * W[i][j] * dinvSqrt[j] * v[j];
      }
      result[i] = sum;
    }
    return result;
  }

  function normalize(v) {
    let norm = 0;
    for (let i = 0; i < n; i++) norm += v[i] * v[i];
    norm = Math.sqrt(norm);
    if (norm > 0) for (let i = 0; i < n; i++) v[i] /= norm;
    return norm;
  }

  function dot(a, b) {
    let s = 0;
    for (let i = 0; i < n; i++) s += a[i] * b[i];
    return s;
  }

  // Power iteration with deflation to get top-k eigenvectors
  const eigenvecs = [];
  const eigenvals = [];
  for (let ev = 0; ev < k; ev++) {
    let v = new Float64Array(n);
    for (let i = 0; i < n; i++) v[i] = randNormal();
    normalize(v);

    for (let iter = 0; iter < 100; iter++) {
      let mv = matVecM(v);
      // Deflate: remove projections onto previously found eigenvectors
      for (let p = 0; p < eigenvecs.length; p++) {
        const proj = dot(mv, eigenvecs[p]);
        for (let i = 0; i < n; i++) mv[i] -= proj * eigenvecs[p][i];
      }
      const lambda = normalize(mv);
      // Check convergence
      let diff = 0;
      for (let i = 0; i < n; i++) diff += (mv[i] - v[i]) * (mv[i] - v[i]);
      v = mv;
      if (Math.sqrt(diff) < 1e-8) break;
    }
    eigenvecs.push(v);
    eigenvals.push(dot(matVecM(v), v));
  }

  // Build embedding: each row is a point in k-dimensional space
  // Normalize rows to unit length (for better k-means)
  const embedding = [];
  for (let i = 0; i < n; i++) {
    const row = [];
    for (let ev = 0; ev < k; ev++) row.push(eigenvecs[ev][i]);
    const norm = Math.sqrt(row.reduce((s, v) => s + v * v, 0));
    embedding.push(norm > 0 ? row.map(v => v / norm) : row);
  }

  // K-means on embedding
  function kmeans(points, k, maxIter = 50) {
    const dim = points[0].length;
    const np = points.length;

    // Initialize centroids with k-means++
    const centroids = [];
    centroids.push([...points[Math.floor(rng() * np)]]);

    for (let c = 1; c < k; c++) {
      const dists = points.map(p => {
        let minD = Infinity;
        for (const cent of centroids) {
          let d = 0;
          for (let j = 0; j < dim; j++) d += (p[j] - cent[j]) ** 2;
          minD = Math.min(minD, d);
        }
        return minD;
      });
      const total = dists.reduce((a, b) => a + b, 0);
      let r = rng() * total, acc = 0;
      for (let i = 0; i < np; i++) {
        acc += dists[i];
        if (acc >= r) { centroids.push([...points[i]]); break; }
      }
      if (centroids.length <= c) centroids.push([...points[Math.floor(rng() * np)]]);
    }

    let assignments = new Array(np).fill(0);
    for (let iter = 0; iter < maxIter; iter++) {
      // Assign
      let changed = false;
      for (let i = 0; i < np; i++) {
        let bestC = 0, bestD = Infinity;
        for (let c = 0; c < k; c++) {
          let d = 0;
          for (let j = 0; j < dim; j++) d += (points[i][j] - centroids[c][j]) ** 2;
          if (d < bestD) { bestD = d; bestC = c; }
        }
        if (assignments[i] !== bestC) { assignments[i] = bestC; changed = true; }
      }
      if (!changed) break;

      // Update centroids
      for (let c = 0; c < k; c++) {
        const members = [];
        for (let i = 0; i < np; i++) if (assignments[i] === c) members.push(i);
        if (members.length === 0) continue;
        for (let j = 0; j < dim; j++) {
          centroids[c][j] = members.reduce((s, m) => s + points[m][j], 0) / members.length;
        }
      }
    }
    return assignments;
  }

  return kmeans(embedding, k);
}

// ── Color palette for clusters ───────────────────────────────────────
const clusterPalette = [
  "#6c8cff", "#34d399", "#f472b6", "#fbbf24", "#a78bfa",
  "#fb923c", "#38bdf8", "#e879f9", "#4ade80", "#f87171",
  "#22d3ee", "#facc15",
];

// ── Sizing ───────────────────────────────────────────────────────────
const capExtent = d3.extent(stocks, d => d.marketCap);
const radiusScale = d3.scaleSqrt().domain(capExtent).range([10, 48]);

function formatCap(b) {
  if (b >= 1000) return `$${(b / 1000).toFixed(1)}T`;
  return `$${b}B`;
}

// ── SVG setup ────────────────────────────────────────────────────────
let width = window.innerWidth;
let height = window.innerHeight;

const svg = d3.select("#graph-container")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

const defs = svg.append("defs");
const filter = defs.append("filter").attr("id", "glow");
filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "coloredBlur");
const feMerge = filter.append("feMerge");
feMerge.append("feMergeNode").attr("in", "coloredBlur");
feMerge.append("feMergeNode").attr("in", "SourceGraphic");

const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.2, 5])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

const tooltip = d3.select("#tooltip");

// ── Main render ──────────────────────────────────────────────────────
let simulation;

function render(threshold, numClusters) {
  // Run spectral clustering with current k
  const clusterAssignments = spectralCluster(corrMatrix, N, numClusters);

  // Build cluster member lists for legend
  const clusterMembers = {};
  clusterAssignments.forEach((c, i) => {
    if (!clusterMembers[c]) clusterMembers[c] = [];
    clusterMembers[c].push(stocks[i].ticker);
  });

  // Filter edges by threshold
  const edges = allEdges
    .filter(e => e.correlation >= threshold)
    .map(e => ({ source: e.source, target: e.target, correlation: e.correlation }));

  // Nodes
  const nodes = stocks.map((s, i) => ({
    ...s,
    index: i,
    radius: radiusScale(s.marketCap),
    cluster: clusterAssignments[i],
  }));

  const color = d => clusterPalette[d.cluster % clusterPalette.length];

  // Connection stats
  const connCount = new Array(N).fill(0);
  const corrSum = new Array(N).fill(0);
  edges.forEach(e => {
    const si = typeof e.source === 'object' ? e.source.index : e.source;
    const ti = typeof e.target === 'object' ? e.target.index : e.target;
    connCount[si]++;
    connCount[ti]++;
    corrSum[si] += e.correlation;
    corrSum[ti] += e.correlation;
  });

  // ── Draw ──
  g.selectAll("*").remove();

  // Edges
  const linkSel = g.append("g")
    .selectAll("line")
    .data(edges)
    .join("line")
    .attr("class", "link")
    .attr("stroke", "#1e2a45")
    .attr("stroke-width", d => 0.5 + d.correlation * 2.2)
    .attr("stroke-opacity", d => 0.06 + d.correlation * 0.28);

  // Node groups
  const nodeSel = g.append("g")
    .selectAll("g")
    .data(nodes)
    .join("g")
    .attr("class", "node");

  // Circles
  nodeSel.append("circle")
    .attr("class", "node-circle")
    .attr("r", d => d.radius)
    .attr("fill", d => color(d))
    .attr("fill-opacity", 0.8)
    .attr("stroke", d => d3.color(color(d)).brighter(0.6))
    .attr("stroke-width", 1.5)
    .attr("filter", "url(#glow)");

  // Labels inside large nodes
  nodeSel.append("text")
    .attr("class", "node-label")
    .attr("font-size", d => {
      if (d.radius > 30) return 11;
      if (d.radius > 20) return 9;
      return 0;
    })
    .attr("opacity", d => d.radius > 18 ? 1 : 0)
    .text(d => d.ticker);

  // ── Interaction ──
  nodeSel
    .on("mouseover", function(event, d) {
      d3.select(this).select("circle")
        .transition().duration(150)
        .attr("fill-opacity", 1)
        .attr("stroke-width", 3);

      // Highlight connected edges
      linkSel
        .attr("stroke", e => {
          const si = typeof e.source === 'object' ? e.source.index : e.source;
          const ti = typeof e.target === 'object' ? e.target.index : e.target;
          return (si === d.index || ti === d.index) ? color(d) : "#1e2a45";
        })
        .attr("stroke-opacity", e => {
          const si = typeof e.source === 'object' ? e.source.index : e.source;
          const ti = typeof e.target === 'object' ? e.target.index : e.target;
          return (si === d.index || ti === d.index) ? 0.75 : 0.04;
        });

      // Dim non-connected nodes
      const connected = new Set([d.index]);
      edges.forEach(e => {
        const si = typeof e.source === 'object' ? e.source.index : e.source;
        const ti = typeof e.target === 'object' ? e.target.index : e.target;
        if (si === d.index) connected.add(ti);
        if (ti === d.index) connected.add(si);
      });

      nodeSel.select("circle")
        .attr("fill-opacity", n => connected.has(n.index) ? 0.9 : 0.12);
      nodeSel.select("text")
        .attr("opacity", n => {
          if (n.radius <= 18) return 0;
          return connected.has(n.index) ? 1 : 0.12;
        });

      // Tooltip
      const avgCorr = connCount[d.index] > 0
        ? (corrSum[d.index] / connCount[d.index]).toFixed(3) : "N/A";
      tooltip.select(".tt-ticker").text(d.ticker).style("color", color(d));
      tooltip.select(".tt-name").text(d.name);
      tooltip.select(".tt-sector").text(d.sector);
      tooltip.select(".tt-mcap").text(formatCap(d.marketCap));
      tooltip.select(".tt-cluster").text(`Cluster ${d.cluster + 1}`)
        .style("color", color(d));
      tooltip.select(".tt-conn").text(connCount[d.index]);
      tooltip.select(".tt-corr").text(avgCorr);
      tooltip.style("display", "block");
    })
    .on("mousemove", function(event) {
      const pad = 16;
      let x = event.clientX + pad;
      let y = event.clientY + pad;
      if (x + 210 > window.innerWidth) x = event.clientX - 210 - pad;
      if (y + 200 > window.innerHeight) y = event.clientY - 200 - pad;
      tooltip.style("left", x + "px").style("top", y + "px");
    })
    .on("mouseout", function() {
      d3.select(this).select("circle")
        .transition().duration(300)
        .attr("fill-opacity", 0.8)
        .attr("stroke-width", 1.5);

      linkSel
        .attr("stroke", "#1e2a45")
        .attr("stroke-opacity", d => 0.06 + d.correlation * 0.28);

      nodeSel.select("circle").attr("fill-opacity", 0.8);
      nodeSel.select("text").attr("opacity", d => d.radius > 18 ? 1 : 0);

      tooltip.style("display", "none");
    });

  // Drag
  const drag = d3.drag()
    .on("start", (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on("end", (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
  nodeSel.call(drag);

  // ── Force simulation ──
  if (simulation) simulation.stop();

  simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(edges)
      .id(d => d.index)
      .distance(d => 130 - d.correlation * 80)
      .strength(d => 0.15 + d.correlation * 0.5))
    .force("charge", d3.forceManyBody().strength(-280))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide().radius(d => d.radius + 5))
    .force("x", d3.forceX(width / 2).strength(0.035))
    .force("y", d3.forceY(height / 2).strength(0.035))
    .on("tick", () => {
      linkSel
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
    });

  // ── Legend ──
  const legendDiv = d3.select("#legend");
  legendDiv.html("");
  legendDiv.append("h3").text("Clusters (correlation-based)");

  const sortedClusters = Object.keys(clusterMembers)
    .map(Number)
    .sort((a, b) => a - b);

  sortedClusters.forEach(c => {
    const col = clusterPalette[c % clusterPalette.length];
    const item = legendDiv.append("div").attr("class", "legend-item");
    item.append("div").attr("class", "legend-dot").style("background", col);
    item.append("span").text(`Cluster ${c + 1}`);
    legendDiv.append("div").attr("class", "legend-members")
      .text(clusterMembers[c].join(", "));
  });

  legendDiv.append("div")
    .style("margin-top", "10px").style("font-size", "10px").style("color", "#556677")
    .html("Node size = market cap<br>Edge opacity = correlation strength");
}

// ── Initial render ───────────────────────────────────────────────────
let currentThreshold = 0.55;
let currentClusters = 6;
render(currentThreshold, currentClusters);

// ── Controls ─────────────────────────────────────────────────────────
d3.select("#threshold-slider").on("input", function() {
  currentThreshold = +this.value;
  d3.select("#threshold-value").text(currentThreshold.toFixed(2));
  render(currentThreshold, currentClusters);
});

d3.select("#cluster-slider").on("input", function() {
  currentClusters = +this.value;
  d3.select("#cluster-value").text(currentClusters);
  render(currentThreshold, currentClusters);
});

window.addEventListener("resize", () => {
  width = window.innerWidth;
  height = window.innerHeight;
  svg.attr("width", width).attr("height", height);
  render(currentThreshold, currentClusters);
});
</script>

</body>
</html>
